plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boox.firefoxscroll'
    compileSdk 35

    defaultConfig {
        // New application ID avoids conflicts with any earlier test build.
        applicationId 'com.boox.firefoxscroll.compat'
        minSdk 23
        targetSdk 32
        versionCode 2
        versionName '1.0.1-boox'
    }
}
